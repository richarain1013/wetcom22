name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            name: windows
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x64

    runs-on: ${{ matrix.platform }}
    name: build-${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Manual runs create a published release so Assets are visible without hunting drafts.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
          releaseName: WeCom Launcher ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
          releaseBody: |
            ## Downloads
            - **Windows**: `*-setup.exe` or `*.msi`
            - **macOS**: `*.dmg`

            See `docs/WINDOWS.md` for usage.
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
          includeUpdaterJson: false

      - name: Upload installers (Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: wecom-launcher-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 30
